name: Android CI and Release APKs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      - name: Surface unit test failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/gradle-test.log"
          if [[ -f "$log_file" ]]; then
            test_failures="$(python3 .github/scripts/summarize_test_failures.py)"
            if [[ -n "$test_failures" ]]; then
              details="$test_failures"
            else
              failure_line="$(grep -n -m 1 '^FAILURE: Build failed' "$log_file" | cut -d: -f1 || true)"
              if [[ -n "$failure_line" ]]; then
                failure_end=$((failure_line + 18))
                details="$(sed -n "${failure_line},${failure_end}p" "$log_file")"
              else
                details="$(tail -n 18 "$log_file")"
              fi
            fi
            details="${details:0:3500}"
            {
              echo '### Gradle unit test failure details'
              echo '```text'
              printf '%s\n' "$details"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/android-ci.yml,line=65,title=Gradle unit tests failed::$details"
          fi

      - name: Assemble production release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"

      - name: Surface release build failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/gradle-release.log"
          if [[ -f "$log_file" ]]; then
            failure_line="$(grep -n -m 1 '^FAILURE: Build failed' "$log_file" | cut -d: -f1 || true)"
            diagnostics="$(grep -E '^(e: |w: |> Task .* FAILED)' "$log_file" | tail -n 12 || true)"
            if [[ -n "$failure_line" ]]; then
              failure_end=$((failure_line + 24))
              failure_details="$(sed -n "${failure_line},${failure_end}p" "$log_file")"
            else
              failure_details="$(tail -n 24 "$log_file")"
            fi
            details="$(printf '%s\n%s\n' "$diagnostics" "$failure_details")"
            details="${details:0:3500}"
            {
              echo '### Gradle release build failure details'
              echo '```text'
              printf '%s\n' "$details"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/android-ci.yml,line=104,title=Gradle release build failed::$details"
          fi

      - name: Verify ABI APKs are present and unsigned
        shell: bash
        run: |
          set -euo pipefail

          output_dir="app/build/outputs/apk/release"
          artifact_dir="release-artifacts"
          expected_abis=(armeabi-v7a arm64-v8a x86 x86_64)

          if [[ ! -d "$output_dir" ]]; then
            echo "::error::Gradle did not create the release APK output directory: $output_dir"
            exit 1
          fi

          shopt -s nullglob
          apks=("$output_dir"/*.apk)
          if [[ ${#apks[@]} -ne ${#expected_abis[@]} ]]; then
            echo "::error::Expected ${#expected_abis[@]} ABI APKs, found ${#apks[@]}"
            printf 'Found: %s\n' "${apks[@]:-none}"
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build-tools were not found"
            exit 1
          fi
          mapfile -t apksigners < <(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V)
          if [[ ${#apksigners[@]} -eq 0 ]]; then
            echo "::error::apksigner was not found in the Android SDK build-tools"
            exit 1
          fi
          apksigner="${apksigners[${#apksigners[@]}-1]}"

          mkdir -p "$artifact_dir"
          for abi in "${expected_abis[@]}"; do
            matches=("$output_dir"/*-"$abi"-release-unsigned.apk)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one release APK for $abi, found ${#matches[@]}"
              printf 'Matches: %s\n' "${matches[@]:-none}"
              exit 1
            fi

            source_apk="${matches[0]}"
            if [[ "$source_apk" != *-unsigned.apk ]]; then
              echo "::error::Expected an unsigned APK filename for $abi, got $source_apk"
              exit 1
            fi

            destination_dir="$artifact_dir/$abi"
            destination_apk="$destination_dir/audio-transcriber-$abi-unsigned.apk"
            mkdir -p "$destination_dir"
            unzip -tq "$source_apk"

            if "$apksigner" verify "$source_apk" >/dev/null 2>&1; then
              echo "::error::Expected an unsigned release APK, but $source_apk has a valid signature"
              exit 1
            fi

            cp "$source_apk" "$destination_apk"
            echo "Prepared unsigned $abi APK: $destination_apk"
          done

      - name: Publish release APK summary
        shell: bash
        run: |
          {
            echo '### Audio Transcriber release APKs'
            echo
            echo 'Application ID: `com.blindtechnexus.audiotranscriber`'
            echo
            echo 'All APKs are unsigned; sign them with a distributor-owned key before installation or publishing.'
            echo
            echo '| ABI | SHA-256 |'
            echo '| --- | --- |'
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              apk="release-artifacts/$abi/audio-transcriber-$abi-unsigned.apk"
              printf '| `%s` | `%s` |\n' "$abi" "$(sha256sum "$apk" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: audio-transcriber-release-armeabi-v7a-unsigned
          path: release-artifacts/armeabi-v7a/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: audio-transcriber-release-arm64-v8a-unsigned
          path: release-artifacts/arm64-v8a/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v7
        with:
          name: audio-transcriber-release-x86-unsigned
          path: release-artifacts/x86/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: audio-transcriber-release-x86_64-unsigned
          path: release-artifacts/x86_64/*.apk
          if-no-files-found: error
          retention-days: 30
